<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Memory Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            background: rgb(45, 90, 39); 
            user-select: none;
            touch-action: manipulation;
            height: 100vh; /* Fallback */
            height: 100dvh; /* Dynamic Viewport Height */
            width: 100vw;
        }
        .jungle-bg {
            background: linear-gradient(to bottom, rgb(74, 222, 128), rgb(22, 101, 52));
            position: relative;
            height: 100%;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .fredoka { font-family: 'Fredoka One', cursive; }
        
        /* Banked Asset: Vine Graphics */
        .vine {
            position: absolute;
            top: -10px;
            width: 4px;
            background: rgb(20, 83, 45);
            border-radius: 0 0 20px 20px;
            z-index: 1;
            transform-origin: top center;
            animation: sway 5s ease-in-out infinite;
        }
        
        /* Banked Asset: Leaf Graphics */
        .leaf {
            position: absolute;
            width: 40px;
            height: 25px;
            background: rgb(21, 128, 61); /* Reverted to previous Green */
            border-radius: 50% 0 50% 0;
            transform: rotate(-15deg);
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .number-block {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            box-shadow: 0 6px 0 rgb(180, 83, 9);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
        }

        /* Interaction Lock Class */
        .number-block.locked {
            cursor: default;
            pointer-events: none; /* Disables clicks and :active state */
        }
        
        @media (min-width: 768px) {
            .number-block { box-shadow: 0 10px 0 rgb(180, 83, 9); }
        }

        .number-block:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: 0 2px 0 rgb(180, 83, 9);
        }

        .hidden-num span {
            display: none;
        }

        .monkey-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake { animation: shake 0.2s ease-in-out 0s 2; }

        /* Adaptive Grid Container */
        .game-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1rem;
        }

        .game-canvas {
            /* Smart sizing: fits width but capped by height to ensure square fits on screen */
            width: 100%;
            max-width: min(85vw, 55vh); 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(10px, 2vw, 24px); /* Responsive gap */
            margin: auto;
        }

        /* Landscape adjustments for short screens (mobile landscape) */
        @media (max-height: 500px) and (orientation: landscape) {
            .game-canvas {
                max-width: min(50vw, 50vh); /* Reduced height constraint slightly to accommodate larger headers */
                gap: 8px;
            }
            /* Hide vines on short screens to clear view */
            .vine { display: none; } 
        }

        .level-up-anim {
            animation: levelUp 0.8s ease-out forwards;
        }

        @keyframes levelUp {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.8; color: rgb(251, 191, 36); }
            100% { transform: scale(1); opacity: 1; }
        }

        #praise-pop {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            opacity: 0;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        #praise-pop.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* Common Button Style for Corner Buttons */
        .corner-btn {
            position: fixed;
            z-index: 50;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            padding: 0.5rem;
            border-radius: 50%;
            color: white;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .corner-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }

        /* Increased spacing from edges for buttons */
        #fullscreen-btn { top: 1.5rem; right: 1.5rem; }
        #reset-btn { bottom: 1.5rem; right: 1.5rem; }
    </style>
</head>
<body>

<div class="jungle-bg">
    <!-- Decorative Vines -->
    <div class="vine" style="left: 5%; height: 20vh; animation-delay: 0s;">
        <div class="leaf" style="top: 80%; left: -20px; transform: rotate(-45deg)"></div>
        <div class="leaf" style="top: 40%; left: 10px; transform: rotate(45deg) scaleX(-1)"></div>
    </div>
    <div class="vine" style="left: 15%; height: 12vh; animation-delay: 1s;">
        <div class="leaf" style="top: 70%; left: -10px; transform: rotate(-10deg)"></div>
    </div>
    <div class="vine" style="left: 28%; height: 25vh; animation-delay: 2s;">
        <div class="leaf" style="top: 85%; left: 10px; transform: scaleX(-1) rotate(10deg)"></div>
        <div class="leaf" style="top: 30%; left: -15px; transform: rotate(-20deg)"></div>
    </div>
    <div class="vine" style="left: 50%; height: 10vh; animation-delay: 0.5s;">
        <div class="leaf" style="top: 60%; left: -12px;"></div>
    </div>
    <div class="vine" style="left: 65%; height: 22vh; animation-delay: 1.5s;">
        <div class="leaf" style="top: 80%; left: -20px; transform: rotate(-30deg)"></div>
    </div>
    <div class="vine" style="left: 80%; height: 15vh; animation-delay: 2.5s;">
        <div class="leaf" style="top: 75%; left: 10px; transform: scaleX(-1)"></div>
        <div class="leaf" style="top: 20%; left: -8px; transform: rotate(-10deg)"></div>
    </div>
    <div class="vine" style="left: 92%; height: 18vh; animation-delay: 0.8s;">
        <div class="leaf" style="top: 85%; left: -15px; transform: rotate(-45deg)"></div>
    </div>

    <!-- Reset / Home Button (Bottom Right) -->
    <button id="reset-btn" class="corner-btn" title="Back to Start">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 sm:w-8 sm:h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
    </button>

    <!-- Full Screen Button (Top Right) -->
    <button id="fullscreen-btn" class="corner-btn" title="Toggle Full Screen">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 sm:w-8 sm:h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
    </button>
    
    <!-- Praise Pop-up -->
    <div id="praise-pop" class="fredoka text-4xl sm:text-7xl text-yellow-300">NICE!</div>

    <!-- Header Section -->
    <!-- Increased padding: pt-12 (mobile), pt-16 (tablet), pt-24 (desktop) -->
    <div class="w-full max-w-7xl flex justify-between items-start pt-12 px-6 sm:pt-16 sm:px-10 lg:pt-24 lg:px-16 z-10 flex-none landscape:pt-4">
        <div class="monkey-float flex flex-col items-center">
            <!-- Scaled up monkey SVG for larger screens -->
            <svg class="w-14 h-14 sm:w-24 sm:h-24 lg:w-32 lg:h-32 xl:w-40 xl:h-40 landscape:w-12 landscape:h-12" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" fill="rgb(120, 53, 15)" />
                <circle cx="50" cy="55" r="32" fill="rgb(217, 119, 6)" opacity="0.4" />
                <circle cx="15" cy="50" r="12" fill="rgb(120, 53, 15)" />
                <circle cx="85" cy="50" r="12" fill="rgb(120, 53, 15)" />
                <circle cx="35" cy="45" r="6" fill="white" />
                <circle cx="35" cy="45" r="3" fill="black" />
                <circle cx="65" cy="45" r="6" fill="white" />
                <circle cx="65" cy="45" r="3" fill="black" />
                <path d="M 35 65 Q 50 75 65 65" stroke="white" stroke-width="3" fill="transparent" />
            </svg>
            <div class="bg-yellow-400 p-2 rounded-full border-4 border-yellow-600 shadow-lg -mt-2 z-20">
                <!-- Scaled up timer text -->
                <div id="timer" class="fredoka text-lg sm:text-2xl lg:text-4xl xl:text-5xl text-yellow-900 leading-none px-2 min-w-[3ch] text-center">0.0s</div>
            </div>
        </div>

        <div class="text-right mr-12 sm:mr-0">
            <!-- Scaled up Title text -->
            <h1 class="fredoka text-lg sm:text-3xl lg:text-5xl xl:text-6xl text-white drop-shadow-lg text-right leading-tight">THE MEMORY<br>CHALLENGE</h1>
            <!-- Scaled up Level & Lives text -->
            <div id="level-indicator" class="text-yellow-200 fredoka text-base sm:text-2xl lg:text-3xl xl:text-4xl mt-1 sm:mt-2">Level: 1</div>
            <div id="lives-indicator" class="text-yellow-200 fredoka text-base sm:text-2xl lg:text-3xl xl:text-4xl mt-1">Lives: 3</div>
        </div>
    </div>

    <!-- Middle Section: Dynamic Spacing Container -->
    <div class="game-container z-10">
        
        <!-- Game Board (Grid) -->
        <div id="game-board" class="game-canvas hidden"></div>

        <!-- Main Menu & Instructions -->
        <div id="menu-area" class="w-full flex flex-col items-center justify-center">
            <div id="instructions" class="bg-white/20 backdrop-blur-sm p-4 sm:p-6 lg:p-10 rounded-2xl sm:rounded-3xl mb-4 sm:mb-8 text-center max-w-[85vw] sm:max-w-md lg:max-w-2xl border-2 border-white/30 shadow-xl">
                <h2 class="fredoka text-white text-xl sm:text-3xl lg:text-5xl mb-2 sm:mb-4">How to Play</h2>
                <p class="text-white text-sm sm:text-lg lg:text-2xl leading-relaxed">Memorize the positions of the numbers. Tap them in order (1, 2, 3...) when they hide. You have 3 chances!</p>
            </div>
            
            <button id="start-btn" class="bg-yellow-400 hover:bg-yellow-300 text-yellow-900 px-8 py-4 sm:px-16 sm:py-8 lg:px-24 lg:py-12 rounded-2xl sm:rounded-[2.5rem] fredoka text-2xl sm:text-5xl lg:text-7xl flex items-center gap-3 sm:gap-6 border-b-[6px] sm:border-b-[12px] border-yellow-600 active:border-b-0 active:translate-y-2 transition-all shadow-2xl">
                <svg class="w-6 h-6 sm:w-12 sm:h-12 lg:w-20 lg:h-20" fill="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="15" r="5" />
                    <circle cx="6" cy="7" r="3" />
                    <circle cx="12" cy="5" r="3" />
                    <circle cx="18" cy="7" r="3" />
                </svg>
                START
            </button>
        </div>

    </div>

    <!-- Footer Area (Flex-none) -->
    <!-- Added pb-8 (mobile) and pb-12 (desktop) for bottom breathing room -->
    <div class="w-full flex-none h-auto pb-20 sm:pb-28 lg:pb-36 flex items-start justify-center z-10 landscape:pb-8">
        <div id="message" class="fredoka text-lg sm:text-2xl lg:text-3xl text-white text-center hidden drop-shadow-lg animate-bounce"></div>
    </div>

    <!-- Error/Game Over Modal -->
    <div id="overlay" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white p-6 sm:p-10 rounded-3xl text-center max-w-sm w-full shadow-2xl transform scale-100 transition-transform">
            <h2 id="modal-title" class="fredoka text-3xl sm:text-5xl text-yellow-600 mb-4"></h2>
            <p id="modal-text" class="text-gray-700 text-lg sm:text-2xl mb-6 sm:mb-8 font-bold"></p>
            <button onclick="closeModal()" class="bg-yellow-500 text-white fredoka text-xl sm:text-2xl px-8 py-3 rounded-full hover:bg-yellow-600 w-full shadow-lg active:scale-95 transition-transform">TRY AGAIN</button>
        </div>
    </div>
</div>

<script>
    // --- GAME STATE VARIABLES ---
    const gameBoard = document.getElementById('game-board');
    const startBtn = document.getElementById('start-btn');
    const menuArea = document.getElementById('menu-area');
    const timerDisplay = document.getElementById('timer');
    const messageDisplay = document.getElementById('message');
    const levelDisplay = document.getElementById('level-indicator');
    const livesDisplay = document.getElementById('lives-indicator');
    const overlay = document.getElementById('overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalText = document.getElementById('modal-text');
    const praisePop = document.getElementById('praise-pop');
    const fsBtn = document.getElementById('fullscreen-btn');
    const resetBtn = document.getElementById('reset-btn');

    let audioCtx = null;
    let currentLevel = 1;
    let currentStep = 1;
    let gameState = 'IDLE'; 
    let startTime;
    let timerInterval;
    let memInterval; 
    let lives = 3;
    let inactivityTimer;
    
    const INACTIVITY_LIMIT = 3 * 60 * 1000; // 3 minutes

    // --- RESET GAME TO HOME FUNCTION ---
    function resetGameToHome() {
        clearInterval(timerInterval);
        clearInterval(memInterval);
        currentLevel = 1;
        lives = 3;
        gameState = 'IDLE';
        levelDisplay.innerText = `Level: 1`;
        livesDisplay.innerText = `Lives: 3`;
        timerDisplay.innerText = '0.0s';
        const blocks = document.querySelectorAll('.number-block');
        blocks.forEach(b => {
            b.classList.remove('shake');
            b.classList.remove('hidden-num');
            b.classList.remove('locked'); 
        });
        gameBoard.classList.add('hidden');
        messageDisplay.classList.add('hidden');
        messageDisplay.classList.remove('block');
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
        menuArea.classList.remove('hidden');
        startBtn.innerText = "START";
    }

    // --- INACTIVITY TIMER LOGIC ---
    function resetInactivityTimer() {
        clearTimeout(inactivityTimer);
        // Only set the timer if we are NOT on the home screen (i.e., game is active or ended)
        if (gameState !== 'IDLE' || !menuArea.classList.contains('hidden')) {
             inactivityTimer = setTimeout(resetGameToHome, INACTIVITY_LIMIT);
        }
    }

    // Listen for interactions to reset timer
    ['click', 'touchstart', 'mousemove', 'keydown'].forEach(evt => {
        document.addEventListener(evt, resetInactivityTimer);
    });

    // Start inactivity timer initially
    resetInactivityTimer();

    // --- FULL SCREEN LOGIC ---
    fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
            });
        } else {
            document.exitFullscreen();
        }
    });

    // --- RESET / HOME LOGIC ---
    resetBtn.addEventListener('click', resetGameToHome);

    // --- AUDIO SYSTEM DISABLED ---
    function initAudio() { }
    function playSound(type) { return; }

    // --- VISUAL EFFECTS (PROGRESSIVE PRAISE) ---
    function showPraisePop() {
        const praiseMap = {
            1: ["Good!", "Nice.", "Okay."],
            2: ["That's it!", "Correct.", "Right."],
            3: ["Good Job!", "Well Done!", "Keep it up!"],
            4: ["Great!", "Super!", "Sharp!"],
            5: ["Awesome!", "Amazing!", "Wow!"],
            6: ["Brilliant!", "Excellent!", "Perfect!"],
            7: ["Fantastic!", "Stellar!", "Genius!"],
            8: ["Incredible!", "Master!", "Legend!"],
            9: ["UNBEATABLE!", "CHAMPION!", "GODLIKE!"]
        };

        const options = praiseMap[currentLevel] || praiseMap[9];
        const praiseText = options[Math.floor(Math.random() * options.length)];
        
        praisePop.innerText = praiseText;
        praisePop.classList.add('active');
        
        setTimeout(() => {
            praisePop.classList.remove('active');
        }, 800);
    }

    // --- GAME LOGIC ---
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function createBlocks() {
        gameBoard.innerHTML = '';
        const gridSlots = Array.from({length: 9}, (_, i) => i);
        shuffle(gridSlots); 
        const activeSlots = gridSlots.slice(0, currentLevel);
        const levelNumbers = Array.from({length: currentLevel}, (_, i) => i + 1);
        
        for (let i = 0; i < 9; i++) {
            const container = document.createElement('div');
            container.className = 'w-full aspect-square flex items-center justify-center';
            const activeIndex = activeSlots.indexOf(i);
            if (activeIndex !== -1) {
                const num = levelNumbers[activeIndex];
                const block = document.createElement('div');
                block.className = 'number-block locked bg-yellow-400 rounded-xl sm:rounded-2xl text-3xl sm:text-6xl fredoka text-white border-2 sm:border-4 border-yellow-200';
                block.innerHTML = `<span>${num}</span>`;
                block.dataset.number = num;
                block.onclick = () => handleBlockClick(block);
                container.appendChild(block);
            }
            gameBoard.appendChild(container);
        }
    }

    function retryLevel() {
        gameState = 'MEMORIZING';
        currentStep = 1;
        messageDisplay.innerText = "MEMORIZE WHERE EACH NUMBER IS"; // Static for memorization

        const blocks = document.querySelectorAll('.number-block');
        blocks.forEach(b => {
            b.classList.remove('hidden-num');
            b.classList.remove('opacity-50');
            b.classList.remove('bg-green-400');
            b.classList.add('bg-yellow-400');
            b.classList.add('locked');
        });

        let memCountdown = Math.max(1, 3 - Math.floor(currentLevel / 4)); 
        timerDisplay.innerText = `${memCountdown}s`;
        
        clearInterval(memInterval);
        memInterval = setInterval(() => {
            memCountdown--;
            if (memCountdown <= 0) { 
                clearInterval(memInterval); 
                startPlaying(); 
            } else { 
                playSound('pop'); 
                timerDisplay.innerText = `${memCountdown}s`; 
            }
        }, 800);
    }

    function startGame() {
        initAudio();
        if (gameState === 'MEMORIZING' || gameState === 'PLAYING') return;
        
        if (currentLevel === 1) {
            lives = 3;
        }
        livesDisplay.innerText = `Lives: ${lives}`;

        menuArea.classList.add('hidden');
        gameBoard.classList.remove('hidden');
        messageDisplay.classList.remove('hidden');
        messageDisplay.classList.add('block'); 

        levelDisplay.innerText = `Level: ${currentLevel}`;
        levelDisplay.classList.remove('level-up-anim');
        void levelDisplay.offsetWidth; 
        levelDisplay.classList.add('level-up-anim');

        createBlocks();
        gameState = 'MEMORIZING';
        currentStep = 1;
        messageDisplay.innerText = "MEMORIZE WHERE EACH NUMBER IS"; // Static for memorization
        
        let memCountdown = Math.max(1, 3 - Math.floor(currentLevel / 4)); 
        timerDisplay.innerText = `${memCountdown}s`;
        
        clearInterval(memInterval);
        memInterval = setInterval(() => {
            memCountdown--;
            if (memCountdown <= 0) { 
                clearInterval(memInterval); 
                startPlaying(); 
            } else { 
                playSound('pop'); 
                timerDisplay.innerText = `${memCountdown}s`; 
            }
        }, 800);
    }

    function startPlaying() {
        gameState = 'PLAYING';
        
        if (currentLevel === 1) {
            messageDisplay.innerText = "TAP IT";
        } else {
            messageDisplay.innerText = "TAP THE NUMBERS IN THE RIGHT ORDER!";
        }

        const blocks = document.querySelectorAll('.number-block');
        blocks.forEach(b => {
            b.classList.add('hidden-num');
            b.classList.remove('locked');
        });
        
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 100);
    }

    function updateTimer() {
        const elapsed = (Date.now() - startTime) / 1000;
        timerDisplay.innerText = `${elapsed.toFixed(1)}s`;
    }

    function handleBlockClick(block) {
        if (gameState !== 'PLAYING') return;
        const clickedNum = parseInt(block.dataset.number);
        
        if (clickedNum === currentStep) {
            playSound('correct');
            block.classList.remove('hidden-num');
            block.classList.add('opacity-50', 'bg-green-400');
            currentStep++;
            if (currentStep > currentLevel) {
                levelComplete();
            }
        } else {
            playSound('wrong');
            block.classList.add('shake', 'bg-red-500');
            setTimeout(() => block.classList.remove('shake', 'bg-red-500'), 400);
            
            lives--;
            livesDisplay.innerText = `Lives: ${lives}`;
            
            if (lives <= 0) {
                loseGame();
            } else {
                clearInterval(timerInterval);
                gameState = 'IDLE';
                messageDisplay.innerText = "TRY AGAIN!";
                setTimeout(retryLevel, 1000);
            }
        }
    }

    function levelComplete() {
        clearInterval(timerInterval);
        gameState = 'ENDED';
        playSound('levelUp');
        showPraisePop(); 
        
        if (currentLevel < 9) {
            messageDisplay.innerHTML = `<span class="text-yellow-300">NEXT LEVEL!</span>`;
            currentLevel++;
            lives = 3; 
            setTimeout(startGame, 1200);
        } else {
            messageDisplay.innerText = "MEMORY KING!";
            currentLevel = 1;
            lives = 3; 
            setTimeout(() => {
                menuArea.classList.remove('hidden');
                gameBoard.classList.add('hidden');
                messageDisplay.classList.add('hidden');
                startBtn.innerText = "PLAY AGAIN";
            }, 2000);
        }
    }

    function loseGame() {
        clearInterval(timerInterval);
        gameState = 'ENDED';
        document.querySelectorAll('.number-block').forEach(b => b.classList.remove('hidden-num'));
        
        if (currentLevel === 2 || currentLevel === 3) {
            modalTitle.innerText = "Good enough, but try harder!";
        } else {
            modalTitle.innerText = "Nice Try!"; 
        }
        
        modalText.innerText = `You reached Level ${currentLevel}!`;
        
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
    }

    function closeModal() {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
        gameState = 'IDLE';
        currentLevel = 1; 
        lives = 3; 
        startGame();
    }

    startBtn.addEventListener('click', startGame);
</script>

</body>
</html>
