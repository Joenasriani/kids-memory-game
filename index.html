<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Memory Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            background: rgb(45, 90, 39); 
            user-select: none;
            touch-action: manipulation;
        }
        .jungle-bg {
            background: linear-gradient(to bottom, rgb(74, 222, 128), rgb(22, 101, 52));
            position: relative;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .fredoka { font-family: 'Fredoka One', cursive; }
        
        /* Banked Asset: Vine Graphics */
        .vine {
            position: absolute;
            top: -20px;
            width: 4px;
            background: rgb(20, 83, 45);
            height: 15vh;
            border-radius: 20px;
            z-index: 1;
        }
        
        /* Banked Asset: Leaf Graphics */
        .leaf {
            position: absolute;
            width: 40px;
            height: 25px;
            background: rgb(34, 197, 94);
            border-radius: 50% 0 50% 0;
            transform: rotate(-15deg);
        }

        .number-block {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            box-shadow: 0 6px 0 rgb(180, 83, 9);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
        }
        
        @media (min-width: 768px) {
            .number-block { box-shadow: 0 10px 0 rgb(180, 83, 9); }
        }

        .number-block:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: 0 2px 0 rgb(180, 83, 9);
        }

        .hidden-num span {
            display: none;
        }

        .monkey-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake { animation: shake 0.2s ease-in-out 0s 2; }

        .game-canvas {
            width: 90vw;
            max-width: 500px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        @media (min-width: 1024px) {
            .game-canvas { max-width: 600px; gap: 20px; }
        }

        .level-up-anim {
            animation: levelUp 0.8s ease-out forwards;
        }

        @keyframes levelUp {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.8; color: rgb(251, 191, 36); }
            100% { transform: scale(1); opacity: 1; }
        }

        #praise-pop {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            opacity: 0;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        #praise-pop.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="jungle-bg p-4 sm:p-6 lg:p-10">
    <!-- Decorative Vines -->
    <div class="vine" style="left: 10%"><div class="leaf" style="top: 40px; left: -15px"></div></div>
    <div class="vine" style="left: 85%"><div class="leaf" style="top: 60px; right: -15px; transform: scaleX(-1)"></div></div>
    
    <!-- Praise Pop-up Element -->
    <div id="praise-pop" class="fredoka text-4xl sm:text-7xl text-yellow-300">NICE!</div>

    <!-- Header Section -->
    <div class="w-full max-w-4xl flex justify-between items-start z-10">
        <div class="monkey-float relative">
            <!-- Banked Asset: Monkey SVG Code -->
            <svg class="w-16 h-16 sm:w-24 sm:h-24" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" fill="rgb(120, 53, 15)" />
                <circle cx="50" cy="55" r="32" fill="rgb(217, 119, 6)" opacity="0.4" />
                <circle cx="15" cy="50" r="12" fill="rgb(120, 53, 15)" />
                <circle cx="85" cy="50" r="12" fill="rgb(120, 53, 15)" />
                <circle cx="35" cy="45" r="6" fill="white" />
                <circle cx="35" cy="45" r="3" fill="black" />
                <circle cx="65" cy="45" r="6" fill="white" />
                <circle cx="65" cy="45" r="3" fill="black" />
                <path d="M 35 65 Q 50 75 65 65" stroke="white" stroke-width="3" fill="transparent" />
            </svg>
            <div class="absolute -bottom-1 -right-2 sm:-bottom-2 sm:-right-4 bg-yellow-400 p-1 sm:p-2 rounded-full border-2 sm:border-4 border-yellow-600 shadow-lg">
                <div id="timer" class="fredoka text-xs sm:text-xl text-yellow-900">0.0s</div>
            </div>
        </div>

        <div class="text-right">
            <h1 class="fredoka text-lg sm:text-3xl text-white drop-shadow-lg text-right">THE MEMORY<br>CHALLENGE</h1>
            <div id="level-indicator" class="text-yellow-200 fredoka text-base sm:text-2xl">Level: 1</div>
        </div>
    </div>

    <!-- Game Board (Grid) -->
    <div id="game-board" class="game-canvas py-4 sm:py-8 hidden">
    </div>

    <!-- Main Menu & Instructions -->
    <div id="menu-area" class="z-10 w-full flex flex-col items-center flex-grow justify-center">
        <div id="instructions" class="bg-white/20 backdrop-blur-sm p-5 sm:p-8 rounded-3xl mb-10 text-center max-w-xs sm:max-w-md border-2 border-white/30 shadow-xl">
            <h2 class="fredoka text-white text-2xl sm:text-4xl mb-4">How to Play</h2>
            <p class="text-white text-lg sm:text-2xl leading-relaxed">Watch the numbers, remember where they are, and tap them in order 1, 2, 3...</p>
        </div>
        
        <button id="start-btn" class="bg-yellow-400 hover:bg-yellow-300 text-yellow-900 px-12 py-8 sm:px-24 sm:py-14 rounded-3xl sm:rounded-[3rem] fredoka text-4xl sm:text-7xl flex items-center gap-4 sm:gap-8 border-b-[12px] sm:border-b-[20px] border-yellow-600 active:border-b-0 active:translate-y-4 transition-all shadow-2xl">
            <!-- Banked Asset: Paw Icon SVG -->
            <svg class="w-10 h-10 sm:w-20 sm:h-20" fill="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="15" r="5" />
                <circle cx="6" cy="7" r="3" />
                <circle cx="12" cy="5" r="3" />
                <circle cx="18" cy="7" r="3" />
            </svg>
            START
        </button>
    </div>

    <!-- Feedback Message Area -->
    <div id="message" class="fredoka text-2xl sm:text-4xl text-white mb-10 text-center h-12 sm:h-16 hidden items-center justify-center z-10 drop-shadow-lg"></div>

    <!-- Error/Game Over Modal -->
    <div id="overlay" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white p-6 sm:p-12 rounded-3xl text-center max-w-sm w-full shadow-2xl">
            <h2 id="modal-title" class="fredoka text-3xl sm:text-5xl text-red-600 mb-4">OH BANANAS!</h2>
            <p id="modal-text" class="text-gray-700 text-lg sm:text-2xl mb-6 sm:mb-10">Level is tricky!</p>
            <button onclick="closeModal()" class="bg-yellow-500 text-white fredoka text-xl sm:text-3xl px-6 py-3 sm:py-4 rounded-full hover:bg-yellow-600 w-full">TRY AGAIN</button>
        </div>
    </div>
</div>

<script>
    // --- BANKED ASSETS & DATA ---
    // These lists are hardcoded so no external generation is needed.
    const praises = [
        "GOOD JOB!", 
        "GREAT!", 
        "BRAVO!", 
        "NICE!", 
        "AWESOME!", 
        "YOU GOT IT!", 
        "SUPER!", 
        "BRILLIANT!", 
        "FANTASTIC!", 
        "KEEP IT UP!",
        "YOU ARE THE BEST!",
        "YOU MUST BE A CHAMPION!",
        "WOW!"
    ];

    // --- GAME STATE VARIABLES ---
    const gameBoard = document.getElementById('game-board');
    const startBtn = document.getElementById('start-btn');
    const menuArea = document.getElementById('menu-area');
    const timerDisplay = document.getElementById('timer');
    const messageDisplay = document.getElementById('message');
    const levelDisplay = document.getElementById('level-indicator');
    const overlay = document.getElementById('overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalText = document.getElementById('modal-text');
    const praisePop = document.getElementById('praise-pop');

    let audioCtx = null;
    let currentLevel = 1;
    let currentStep = 1;
    let gameState = 'IDLE'; 
    let startTime;
    let timerInterval;

    // --- AUDIO SYSTEM (Synthesized Locally) ---
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
            // High pitch sine wave
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(); osc.stop(now + 0.1);
        } else if (type === 'wrong') {
            // Sawtooth low buzz
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(50, now + 0.3);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(); osc.stop(now + 0.3);
        } else if (type === 'levelUp') {
            // Triangle wave arpeggio effect
            osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
            gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(); osc.stop(now + 0.3);
        } else if (type === 'pop') {
            // Quick pop sound
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(); osc.stop(now + 0.05);
        }
    }

    // --- VISUAL EFFECTS ---
    function showPraisePop() {
        // Randomly select a banked praise phrase
        const praiseText = praises[Math.floor(Math.random() * praises.length)];
        praisePop.innerText = praiseText;
        praisePop.classList.add('active');
        
        setTimeout(() => {
            praisePop.classList.remove('active');
        }, 800);
    }

    // --- GAME LOGIC (ALGORITHMS) ---
    // Fisher-Yates Shuffle Algorithm (Not AI, pure math)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function createBlocks() {
        gameBoard.innerHTML = '';
        const gridSlots = Array.from({length: 9}, (_, i) => i);
        shuffle(gridSlots); // Randomize positions
        const activeSlots = gridSlots.slice(0, currentLevel);
        const levelNumbers = Array.from({length: currentLevel}, (_, i) => i + 1);
        
        for (let i = 0; i < 9; i++) {
            const container = document.createElement('div');
            container.className = 'w-full aspect-square flex items-center justify-center';
            const activeIndex = activeSlots.indexOf(i);
            if (activeIndex !== -1) {
                const num = levelNumbers[activeIndex];
                const block = document.createElement('div');
                block.className = 'number-block bg-yellow-400 rounded-xl sm:rounded-2xl text-3xl sm:text-6xl fredoka text-white border-2 sm:border-4 border-yellow-200';
                block.innerHTML = `<span>${num}</span>`;
                block.dataset.number = num;
                block.onclick = () => handleBlockClick(block);
                container.appendChild(block);
            }
            gameBoard.appendChild(container);
        }
    }

    function startGame() {
        initAudio();
        if (gameState === 'MEMORIZING' || gameState === 'PLAYING') return;
        
        menuArea.classList.add('hidden');
        gameBoard.classList.remove('hidden');
        messageDisplay.classList.remove('hidden');
        messageDisplay.classList.add('flex');

        levelDisplay.innerText = `Level: ${currentLevel}`;
        levelDisplay.classList.remove('level-up-anim');
        void levelDisplay.offsetWidth; 
        levelDisplay.classList.add('level-up-anim');

        createBlocks();
        gameState = 'MEMORIZING';
        currentStep = 1;
        messageDisplay.innerText = "LOOK CAREFULLY!";
        
        // Dynamic countdown based on level
        let memCountdown = Math.max(1, 3 - Math.floor(currentLevel / 4)); 
        timerDisplay.innerText = `${memCountdown}s`;
        
        const memInt = setInterval(() => {
            memCountdown--;
            if (memCountdown <= 0) { 
                clearInterval(memInt); 
                startPlaying(); 
            } else { 
                playSound('pop'); 
                timerDisplay.innerText = `${memCountdown}s`; 
            }
        }, 800);
    }

    function startPlaying() {
        gameState = 'PLAYING';
        
        // --- LOGIC: TEXT DISPLAY BASED ON LEVEL ---
        if (currentLevel === 1) {
            messageDisplay.innerText = "TAP IT";
        } else {
            messageDisplay.innerText = "TAP THEM IN THE RIGHT SEQUENCE";
        }

        // Hide the numbers
        document.querySelectorAll('.number-block').forEach(b => b.classList.add('hidden-num'));
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 100);
    }

    function updateTimer() {
        const elapsed = (Date.now() - startTime) / 1000;
        timerDisplay.innerText = `${elapsed.toFixed(1)}s`;
    }

    function handleBlockClick(block) {
        if (gameState !== 'PLAYING') return;
        const clickedNum = parseInt(block.dataset.number);
        
        if (clickedNum === currentStep) {
            playSound('correct');
            // Correct click logic
            block.classList.remove('hidden-num');
            block.classList.add('opacity-50', 'bg-green-400');
            currentStep++;
            if (currentStep > currentLevel) {
                levelComplete();
            }
        } else {
            // Wrong click logic
            playSound('wrong');
            block.classList.add('shake', 'bg-red-500');
            setTimeout(() => block.classList.remove('shake', 'bg-red-500'), 400);
            loseGame();
        }
    }

    function levelComplete() {
        clearInterval(timerInterval);
        gameState = 'ENDED';
        playSound('levelUp');
        showPraisePop(); // Only called here (end of sequence)
        
        if (currentLevel < 9) {
            messageDisplay.innerHTML = `<span class="text-yellow-300">NEXT LEVEL!</span>`;
            currentLevel++;
            setTimeout(startGame, 1200);
        } else {
            // Victory State
            messageDisplay.innerText = "MEMORY KING!";
            currentLevel = 1;
            setTimeout(() => {
                menuArea.classList.remove('hidden');
                gameBoard.classList.add('hidden');
                messageDisplay.classList.add('hidden');
                startBtn.innerText = "PLAY AGAIN";
            }, 2000);
        }
    }

    function loseGame() {
        clearInterval(timerInterval);
        gameState = 'ENDED';
        document.querySelectorAll('.number-block').forEach(b => b.classList.remove('hidden-num'));
        modalTitle.innerText = "OH BANANAS!";
        modalText.innerText = `Almost finished Level ${currentLevel}!`;
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
    }

    function closeModal() {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
        gameState = 'IDLE';
        startGame();
    }

    startBtn.addEventListener('click', startGame);
</script>

</body>
</html>
